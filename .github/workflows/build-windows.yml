name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/**', 'fix/**']
    paths:
      - 'app.py'
      - 'requirements.txt'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: "Video Downloader"
  APP_VERSION: "2.6.0"

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile app.py

      - name: Smoke test UI and runtime
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          python app.py --smoke-test

      - name: Test FFmpeg runtime
        shell: pwsh
        run: |
          @'
          import os
          import subprocess
          import imageio_ffmpeg
          ffmpeg = imageio_ffmpeg.get_ffmpeg_exe()
          assert os.path.isfile(ffmpeg), ffmpeg
          subprocess.check_call([ffmpeg, '-hide_banner', '-version'])
          print('FFmpeg runtime OK:', ffmpeg)
          '@ | Set-Content -Encoding utf8 test_ffmpeg_runtime.py
          python test_ffmpeg_runtime.py

      - name: Test lossless HLS m3u8 to MP4 remux
        shell: pwsh
        run: |
          @'
          import importlib.util
          import subprocess
          import tempfile
          from pathlib import Path

          import imageio_ffmpeg
          from yt_dlp.postprocessor.ffmpeg import FFmpegVideoRemuxerPP

          spec = importlib.util.spec_from_file_location('appmod', 'app.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          ffmpeg = imageio_ffmpeg.get_ffmpeg_exe()
          worker = mod.DownloadWorker(
              'https://example.com/source.m3u8',
              '.',
              'Best quality',
              False,
              mod.I18n('en'),
          )
          opts = worker._build_options(ffmpeg)
          assert opts['merge_output_format'] == 'mp4'
          assert opts['hls_use_mpegts'] is False
          assert opts['fixup'] == 'force'

          yt_worker = mod.DownloadWorker(
              'https://www.youtube.com/watch?v=nZAHDChkLkk',
              '.',
              'Best quality',
              False,
              mod.I18n('en'),
          )
          yt_fallback = yt_worker._build_options(ffmpeg, compatibility=True)
          assert yt_fallback['extractor_args']['youtube']['player_client'] == ['web_safari']
          assert yt_fallback['hls_use_mpegts'] is False
          assert {
              'key': 'FFmpegVideoRemuxer',
              'preferedformat': 'mp4',
          } in opts['postprocessors']

          # yt-dlp's remuxer must be stream-copy based, not a video/audio encode.
          remux_args = list(FFmpegVideoRemuxerPP._options('mp4'))
          assert 'copy' in remux_args, remux_args

          # End-to-end FFmpeg fixture: create a tiny HLS/m3u8 stream, then
          # remux it into MP4 with -c copy and verify an MP4 container exists.
          with tempfile.TemporaryDirectory() as td:
              td = Path(td)
              playlist = td / 'source.m3u8'
              output = td / 'output.mp4'

              subprocess.check_call([
                  ffmpeg, '-hide_banner', '-loglevel', 'error', '-y',
                  '-f', 'lavfi', '-i', 'testsrc=size=160x90:rate=10',
                  '-f', 'lavfi', '-i', 'sine=frequency=1000:sample_rate=44100',
                  '-t', '1.2',
                  '-c:v', 'libx264', '-pix_fmt', 'yuv420p',
                  '-c:a', 'aac',
                  '-f', 'hls', '-hls_time', '0.4', '-hls_list_size', '0',
                  str(playlist),
              ])
              assert playlist.is_file() and playlist.read_text(encoding='utf-8').startswith('#EXTM3U')

              subprocess.check_call([
                  ffmpeg, '-hide_banner', '-loglevel', 'error', '-y',
                  '-i', str(playlist),
                  '-map', '0',
                  '-c', 'copy',
                  '-movflags', '+faststart',
                  str(output),
              ])
              assert output.is_file() and output.stat().st_size > 0
              assert b'ftyp' in output.read_bytes()[:64], 'Output is not an MP4 container'

          print('HLS/m3u8 lossless MP4 remux OK (-c copy)')
          '@ | Set-Content -Encoding utf8 test_hls_lossless_remux.py
          python test_hls_lossless_remux.py

      - name: Test site-specific HLS resolver fixture
        shell: pwsh
        run: |
          @'
          import importlib.util

          spec = importlib.util.spec_from_file_location('appmod', 'app.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          assert mod.is_missav_url('https://missav123.com/dm13/fc2-ppv-3482842')
          assert not mod.is_missav_url('https://example.com/video')

          direct = '<script>const source="https://surrit.com/abc/playlist.m3u8";</script>'
          assert mod.extract_missav_hls_urls(direct) == [
              'https://surrit.com/abc/playlist.m3u8'
          ]

          packed = (
              "eval(function(p,a,c,k,e,d){return p;}("
              "'0',10,1,'https://surrit.com/packed/playlist.m3u8'.split('|'),0,{}))"
          )
          urls = mod.extract_missav_hls_urls(packed)
          assert 'https://surrit.com/packed/playlist.m3u8' in urls, urls
          assert mod.choose_missav_hls_url([
              'https://cdn.example.com/video.m3u8',
              'https://surrit.com/preferred/playlist.m3u8',
          ]) == 'https://surrit.com/preferred/playlist.m3u8'

          html = '''
          <html><head>
          <meta property="og:title" content="Sample: Title? 1080p">
          <title>Fallback title</title>
          </head><body><h1>Heading title</h1></body></html>
          '''
          assert mod.extract_page_title(html) == 'Sample: Title? 1080p'
          safe = mod.safe_output_title('Sample: Title? 1080p')
          assert safe == 'Sample Title 1080p'

          worker = mod.DownloadWorker(
              'https://example.com/source.m3u8',
              'C:/Downloads',
              'Best quality',
              False,
              mod.I18n('en'),
          )
          opts = worker._build_options(mod.imageio_ffmpeg.get_ffmpeg_exe())
          worker._apply_title_output(opts, 'Sample: Title? 1080p')
          assert opts['outtmpl'].endswith('Sample Title 1080p.%(ext)s')

          assert mod.is_avple_url('https://avple.tv/video/102381106165343')
          page_fixture = '''
          <html><head><title>Fallback title</title></head><body>
          <script type="application/json">
          {"props":{"pageProps":{"instance":{"title":"Readable Page Title","play":"https://media.example.com/path/master.m3u8"}}}}
          </script>
          <script>source = 'https://cdn.example.com/media/video.m3u8';</script>
          </body></html>
          '''
          meta = mod._extract_avple_json_metadata(page_fixture)
          assert meta['title'] == 'Readable Page Title'
          assert mod._extract_avple_source(
              page_fixture, 'https://avple.tv/video/123'
          ) == 'https://cdn.example.com/media/video.m3u8'

          print('Site-specific HLS resolver fixture OK')
          '@ | Set-Content -Encoding utf8 test_missav_fixture.py
          python test_missav_fixture.py

      - name: Live probe site-specific HLS compatibility
        shell: pwsh
        timeout-minutes: 2
        run: |
          @'
          import importlib.util
          from urllib.parse import urljoin, urlparse

          from curl_cffi import requests as browser_requests

          spec = importlib.util.spec_from_file_location('appmod', 'app.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          page = 'https://missav123.com/dm13/fc2-ppv-3482842'
          resolved = mod.resolve_missav_stream(page, timeout=30)
          parsed = urlparse(resolved['url'])
          assert parsed.scheme == 'https'
          assert parsed.path.endswith('.m3u8')
          assert 'Referer' in resolved['headers']
          assert resolved.get('title'), 'Page title was not extracted'
          assert len(mod.safe_output_title(resolved['title'])) >= 8

          # Prove that the CDN is not only exposing the master playlist:
          # follow one variant and fetch bytes from a real media segment using
          # the exact browser fingerprint + headers the app passes to yt-dlp.
          session = browser_requests.Session(
              impersonate='chrome',
              headers=resolved['headers'],
          )
          master_url = resolved['url']
          master = session.get(master_url, timeout=30, allow_redirects=True)
          assert master.status_code == 200 and '#EXTM3U' in master.text

          media_url = master_url
          media_text = master.text
          for line in (line.strip() for line in master.text.splitlines()):
              if line and not line.startswith('#') and '.m3u8' in line:
                  media_url = urljoin(master_url, line)
                  variant = session.get(media_url, timeout=30, allow_redirects=True)
                  assert variant.status_code == 200 and '#EXTM3U' in variant.text
                  media_text = variant.text
                  break

          segment = next(
              (
                  line.strip()
                  for line in media_text.splitlines()
                  if line.strip()
                  and not line.lstrip().startswith('#')
                  and '.m3u8' not in line.lower()
              ),
              None,
          )
          assert segment, 'No media segment found in MissAV HLS playlist'
          segment_url = urljoin(media_url, segment)
          segment_response = session.get(
              segment_url,
              headers={**resolved['headers'], 'Range': 'bytes=0-4095'},
              timeout=30,
              allow_redirects=True,
          )
          assert segment_response.status_code in (200, 206), segment_response.status_code
          assert segment_response.content, 'MissAV media segment returned no bytes'
          print('Site-specific live HLS + media segment probe OK:', parsed.hostname)
          '@ | Set-Content -Encoding utf8 test_missav_live.py
          python test_missav_live.py

      - name: Live probe additional player compatibility
        shell: pwsh
        timeout-minutes: 2
        run: |
          @'
          import importlib.util
          from urllib.parse import urlparse

          spec = importlib.util.spec_from_file_location('appmod', 'app.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          page = 'https://avple.tv/video/102381106165343'
          resolved = mod.resolve_avple_stream(page, timeout=30)
          parsed = urlparse(resolved['url'])
          assert parsed.scheme in ('http', 'https')
          assert 'Referer' in resolved['headers']
          assert resolved.get('title'), 'Page title was not extracted'
          assert len(mod.safe_output_title(resolved['title'])) >= 4
          print('Additional live player probe OK:', parsed.hostname)
          '@ | Set-Content -Encoding utf8 test_site2_live.py
          python test_site2_live.py

      - name: Test yt-dlp browser impersonation
        shell: pwsh
        run: |
          @'
          from yt_dlp import YoutubeDL
          from yt_dlp.networking.impersonate import ImpersonateTarget

          with YoutubeDL({'quiet': True, 'no_warnings': True}) as ydl:
              assert ydl._impersonate_target_available(ImpersonateTarget()), 'No curl_cffi impersonation target is available'
              # Verify the specific Chrome fingerprint the app requests is available.
              assert ydl._impersonate_target_available(ImpersonateTarget('chrome')), 'Chrome impersonation target unavailable'
              print('Available impersonation backend: OK (chrome)')
          '@ | Set-Content -Encoding utf8 test_impersonation.py
          python test_impersonation.py

      - name: Test themes and languages render
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          @'
          import importlib.util
          from PySide6.QtWidgets import QApplication
          from PySide6.QtCore import QSettings

          spec = importlib.util.spec_from_file_location('appmod', 'app.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          app = QApplication.instance() or QApplication([])
          s = QSettings('WenZurich', 'ci-theme-lang-test')
          s.clear()
          w = mod.MainWindow(settings=s)

          for mode in ('system', 'light', 'dark'):
              w.theme_mode = mode
              w.apply_theme()
              app.processEvents()
          for code in mod.LANG_ORDER:
              w.i18n.set_language(code)
              w.retranslate()
              app.processEvents()
              assert w.title.text(), 'Title empty for language ' + code

          w.close()
          s.clear()
          print('Themes and languages render OK')
          '@ | Set-Content -Encoding utf8 test_theme_lang.py
          python test_theme_lang.py

      - name: Test download queue scheduler
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          @'
          import importlib.util
          from PySide6.QtWidgets import QApplication
          from PySide6.QtCore import QSettings

          spec = importlib.util.spec_from_file_location('appmod', 'app.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          app = QApplication.instance() or QApplication([])
          s = QSettings('WenZurich', 'ci-queue-scheduler')
          s.clear()
          w = mod.MainWindow(settings=s)

          assert int(w.concurrency_combo.currentData()) == 1
          added, skipped = w.add_urls(
              'https://example.com/a\n'
              'https://example.com/b\n'
              'https://example.com/c\n'
              'https://example.com/a'
          )
          assert (added, skipped) == (3, 1)
          assert [j['url'] for j in w.jobs] == [
              'https://example.com/a',
              'https://example.com/b',
              'https://example.com/c',
          ]

          # Exercise scheduler logic without making network requests.
          w.run_config = {
              'folder': '.',
              'quality': 'Best quality',
              'playlist': False,
              'concurrency': 2,
          }
          w.queue_running = True

          def fake_start(job):
              job['status'] = 'active'
              w.active_jobs[job['id']] = {'thread': None, 'worker': None}

          w._start_job = fake_start
          w._pump_queue()
          assert len(w.active_jobs) == 2
          assert sum(j['status'] == 'pending' for j in w.jobs) == 1

          # A stop in progress must not allow a second queue run to start
          # before the active workers have actually exited.
          w.queue_running = False
          w._refresh_queue_controls()
          assert not w.download_btn.isEnabled()
          w.queue_running = True

          finished_id = next(iter(w.active_jobs))
          finished = w._find_job(finished_id)
          finished['status'] = 'done'
          finished['pct'] = 100.0
          w.active_jobs.pop(finished_id, None)
          w._pump_queue()
          assert len(w.active_jobs) == 2
          assert sum(j['status'] == 'pending' for j in w.jobs) == 0
          assert sum(j['status'] == 'done' for j in w.jobs) == 1

          w.active_jobs.clear()
          w.queue_running = False
          w.close()
          s.clear()
          print('Queue scheduler OK: ordered queue, dedupe, sequential default, concurrency cap')
          '@ | Set-Content -Encoding utf8 test_queue_scheduler.py
          python test_queue_scheduler.py

      - name: Test large queue layout stability
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          @'
          import importlib.util
          from PySide6.QtCore import QSettings, Qt
          from PySide6.QtWidgets import QApplication

          spec = importlib.util.spec_from_file_location('appmod', 'app.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          app = QApplication.instance() or QApplication([])
          s = QSettings('WenZurich', 'ci-large-queue')
          s.clear()
          w = mod.MainWindow(settings=s)
          w.resize(1040, 840)
          w.show()
          app.processEvents()

          urls = [
              'https://example.com/library/item-{0}/'.format(i)
              + ('very-long-path-' * 18)
              + '?token=' + ('x' * 120)
              for i in range(120)
          ]
          added, skipped = w.add_urls('\n'.join(urls))
          app.processEvents(); app.processEvents()

          assert added == 120 and skipped == 0
          assert w.queue_tree.topLevelItemCount() == 120
          assert w.queue_tree.minimumHeight() >= 280
          assert w.queue_tree.horizontalScrollBarPolicy() == Qt.ScrollBarAlwaysOff
          assert w.queue_tree.verticalScrollBar().maximum() > 0
          assert w.width() == 1040
          assert len(w.queue_tree.topLevelItem(0).text(1)) < len(urls[0])
          assert 'waiting' in w.queue_hint_label.text().lower() or '等待' in w.queue_hint_label.text()

          # A very long resolved title must not resize the window.
          w.jobs[0]['title'] = 'Long resolved title ' + ('A' * 600)
          w._render_job(w.jobs[0])
          app.processEvents()
          assert w.width() == 1040

          w.close()
          s.clear()
          print('Large queue UI remains fixed, scrollable, and width-stable')
          '@ | Set-Content -Encoding utf8 test_large_queue.py
          python test_large_queue.py

      - name: Test UI at 125 percent
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QT_SCALE_FACTOR = '1.25'
          python app.py --smoke-test

      - name: Test UI at 150 percent and render preview
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QT_SCALE_FACTOR = '1.5'
          @'
          import importlib.util
          from PySide6.QtWidgets import QApplication
          from PySide6.QtGui import QPixmap
          from PySide6.QtCore import QSettings

          spec = importlib.util.spec_from_file_location('appmod', 'app.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          app = QApplication.instance() or QApplication([])

          def shot(theme, fname):
              s = QSettings('WenZurich', 'ci-preview-' + theme)
              s.clear()
              w = mod.MainWindow(settings=s)
              w.theme_mode = theme
              w.apply_theme()
              w.resize(1040, 840)
              demo_urls = '\n'.join(
                  f'https://example.com/video/{i}/' + ('sample-path-' * 8)
                  for i in range(24)
              )
              w.add_urls(demo_urls)
              w.jobs[0]['status'] = 'done'
              w.jobs[0]['pct'] = 100.0
              w.jobs[0]['title'] = 'A completed video with a readable title'
              w.jobs[1]['status'] = 'active'
              w.jobs[1]['pct'] = 46.0
              w.jobs[2]['status'] = 'failed'
              w.jobs[2]['pct'] = 100.0
              w.jobs[2]['error'] = 'Example error'
              for job in w.jobs[:3]:
                  w._render_job(job)
              w._refresh_queue_controls()
              w.show()
              app.processEvents(); app.processEvents()
              assert w.url_edit.height() >= 42
              assert w.path_edit.height() >= 42
              assert w.download_btn.height() >= 42
              assert w.quality_combo.height() >= 42
              assert w.queue_tree.minimumHeight() >= 280
              assert w.concurrency_combo.count() == 3
              pix = QPixmap(w.size())
              w.render(pix)
              assert pix.save(fname)
              w.close(); s.clear()

          shot('light', 'ui-preview-light-150pct.png')
          shot('dark', 'ui-preview-dark-150pct.png')
          print('150% UI geometry OK (light + dark)')
          '@ | Set-Content -Encoding utf8 test_ui_preview.py
          python test_ui_preview.py

      - name: Test UI at 200 percent
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QT_SCALE_FACTOR = '2.0'
          python app.py --smoke-test

      - name: Upload UI preview
        uses: actions/upload-artifact@v4
        with:
          name: Video-Downloader-UI-preview
          path: |
            ui-preview-light-150pct.png
            ui-preview-dark-150pct.png
          if-no-files-found: error
          retention-days: 7

      - name: Create Windows icon
        shell: pwsh
        run: |
          @'
          from PIL import Image, ImageDraw

          im = Image.new('RGBA', (256, 256), (0, 0, 0, 0))
          d = ImageDraw.Draw(im)
          # Rounded indigo tile matching the app accent (#4F46E5).
          d.rounded_rectangle((12, 12, 244, 244), radius=58, fill=(79, 70, 229, 255))
          # Download glyph: downward arrow over a tray.
          d.rectangle((120, 60, 136, 150), fill='white')
          d.polygon([(92, 132), (164, 132), (128, 178)], fill='white')
          d.rounded_rectangle((78, 188, 178, 202), radius=7, fill='white')
          im.save('app.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | Set-Content -Encoding utf8 make_icon.py
          python make_icon.py

      - name: Create Windows version metadata
        shell: pwsh
        run: |
          @'
          VSVersionInfo(
            ffi=FixedFileInfo(
              filevers=(2,6,0,0), prodvers=(2,6,0,0), mask=0x3f,
              flags=0x0, OS=0x40004, fileType=0x1, subtype=0x0, date=(0,0)
            ),
            kids=[
              StringFileInfo([StringTable(u'040904B0', [
                StringStruct(u'CompanyName', u'WenZurich'),
                StringStruct(u'FileDescription', u'Video Downloader'),
                StringStruct(u'FileVersion', u'2.6.0'),
                StringStruct(u'InternalName', u'Video Downloader'),
                StringStruct(u'OriginalFilename', u'Video Downloader.exe'),
                StringStruct(u'ProductName', u'Video Downloader'),
                StringStruct(u'ProductVersion', u'2.6.0')
              ])]),
              VarFileInfo([VarStruct(u'Translation', [1033, 1200])])
            ]
          )
          '@ | Set-Content -Encoding utf8 version_info.txt

      - name: Build portable Windows app
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onedir `
            --noupx `
            --windowed `
            --name "Video Downloader" `
            --icon app.ico `
            --version-file version_info.txt `
            --collect-all imageio_ffmpeg `
            --collect-all yt_dlp `
            --collect-all curl_cffi `
            --collect-all cffi `
            app.py

      - name: Verify EXE exists and metadata
        shell: pwsh
        run: |
          $exe = 'dist\Video Downloader\Video Downloader.exe'
          if (-not (Test-Path $exe)) { throw 'EXE was not produced.' }
          $item = Get-Item $exe
          $v = $item.VersionInfo
          if ($v.ProductName -ne 'Video Downloader') { throw "Unexpected ProductName: $($v.ProductName)" }
          if ($v.CompanyName -ne 'WenZurich') { throw "Unexpected CompanyName: $($v.CompanyName)" }
          $item | Format-List Name,Length,LastWriteTime
          $v | Format-List CompanyName,ProductName,FileDescription,FileVersion,ProductVersion

      - name: Smoke test packaged EXE
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $p = Start-Process -FilePath 'dist\Video Downloader\Video Downloader.exe' -ArgumentList '--smoke-test' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Packaged EXE smoke test failed with exit code $($p.ExitCode)" }

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $folder = 'dist\Video Downloader'
          $zip = "dist\Video-Downloader-v$env:APP_VERSION-Windows-x64-portable.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $folder -DestinationPath $zip -CompressionLevel Optimal

          Get-FileHash "$folder\Video Downloader.exe" -Algorithm SHA256 |
            Format-List |
            Out-File -Encoding utf8 "$folder\SHA256.txt"

          Get-FileHash $zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $(Split-Path $zip -Leaf)" } |
            Out-File -Encoding ascii "$zip.sha256.txt"

      - name: Upload portable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Video-Downloader-Windows-x64-v2.6.0-portable
          path: |
            dist/Video-Downloader-v2.6.0-Windows-x64-portable.zip
            dist/Video-Downloader-v2.6.0-Windows-x64-portable.zip.sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:APP_VERSION"
          $zip = "dist\Video-Downloader-v$env:APP_VERSION-Windows-x64-portable.zip"
          $sha = "$zip.sha256.txt"
          $title = "Video Downloader v$env:APP_VERSION"
          $notes = @"
          Portable Windows x64 build.

          v2.6.0 expands site-specific player compatibility while keeping readable title-based filenames and the queue-first desktop interface.

          Site-specific HLS/direct-media compatibility and lossless HLS-to-MP4 remuxing remain supported.

          Every download still runs in a separate worker process. Unsupported sites, yt-dlp exceptions, and even a hard worker-process crash are isolated to the affected queue item; the GUI stays alive and continues the queue.

          The build keeps the portable PyInstaller onedir layout to reduce antivirus/browser heuristic false positives.

          Extract the ZIP, keep the folder contents together, then run Video Downloader.exe.

          The build is not Authenticode-signed yet, so Windows or Chrome may still show an unknown-publisher/reputation warning on some systems.
          "@

          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip $sha --clobber --repo "$env:GITHUB_REPOSITORY"
          } else {
            gh release create $tag $zip $sha `
              --repo "$env:GITHUB_REPOSITORY" `
              --target "$env:GITHUB_SHA" `
              --title $title `
              --notes $notes
          }
